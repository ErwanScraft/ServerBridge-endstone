# ==================================================
# ServerBridge Configuration
# ==================================================

webhook:
  # Enable or disable outbound webhook events.
  enabled: false

  # Endpoint that receives POST requests.
  url: ""

  # HTTP request timeout in seconds.
  timeout: 5

  events:
      player.join:
        enabled: true
        message: "🟢 {player} joined the server!"
    
      player.first_join:
        enabled: true
        message: "🎉 {player}! This is their first join!"
    
      player.leave:
        enabled: true
        message: "🔴 {player} left the server!"
      
      player.die:
        enabled: true
        message: "💀 {player} died because of {death_cause}!"
      
      player.chat:
        enabled: true
        message: "💬 {player}: {message}"

inbound:
  # Enable or disable the inbound API.
  enabled: false

  # Address where the API listens.
  # Use 127.0.0.1 when the application runs on the same machine.
  # Use 0.0.0.0 when the application connects remotely.
  host: "127.0.0.1"

  # Inbound API port.
  port: 8765

  actions:
    # Allow applications to send chat messages to the server.
    chat: true

    # Allow applications to execute commands.
    command: false

  command:
    # Only commands listed here can be executed remotely.
    allowed:
      - say
      - tell